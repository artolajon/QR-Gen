
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador QR</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 24px 16px;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0001;
      text-align: center;
    }

    footer {
      margin: auto auto 0;
      color: #555;
      font-size: 14px;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-top: 0;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    textarea {
      display: block;
      width: 100%;
      height: 100px;
      padding: 12px;
      margin: 16px 0;
      font: inherit;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: none;
      border-radius: 8px;
      background: #1769ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0d4ecc;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 24px auto 8px;
      max-width: 100%;
      overflow: hidden;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      height: auto;
    }

    @media (min-width: 600px) {
      body {
        padding-top: 40px;
      }

      .container {
        padding: 30px;
      }

      button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Generador QR</h1>
    <p>Introduce un texto para generar tu código QR.</p>

    <textarea id="text" placeholder="https://ejemplo.com"></textarea>

    <button onclick="generateQR()">Generar QR</button>

    <div id="qrcode"></div>
  </main>

  <footer>@2026 Jon Artola</footer>

  <script>
    function generateQR() {
      const text = document.getElementById("text").value.trim();
      const output = document.getElementById("qrcode");

      if (!text) {
        alert("Introduce un texto o una URL.");
        return;
      }

      if (typeof QRCode === "undefined") {
        alert("No se ha podido cargar la biblioteca QR.");
        return;
      }

      output.innerHTML = "";

      new QRCode(output, {
        text: text,
        width: 256,
        height: 256,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }
  </script>
</body>
</html>
